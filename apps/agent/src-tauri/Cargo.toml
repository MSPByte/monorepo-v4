[package]
name = "MSPAgent"
version = "0.1.21"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-ipc = { path = "../../agent-core/crates/agent-ipc" }
agent-platform = { path = "../../agent-core/crates/agent-platform" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
hostname = "0.4.1"
tokio = "1.47.1"
reqwest = { version = "0.12.23", features = ["json", "multipart"] }
chrono = "0.4.42"
tauri-plugin-screenshots = "2.2.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
local-ip-address = "0.6.5"
rand = "0.8"
sha2 = "0.10"
whoami = "1.6.1"
log = "0.4"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Memory",
] }
