# Dev config for agent-core running with MSPAGENT_DEV=1.
# Copy this file to ~/.mspagent-dev/config.toml before running `bun run dev:agent`.

[agent]
# Agents backend runs on 3001 in dev.
server_url = "http://localhost:3001"

# Your dev org ID — find it in the MSP portal under Settings → General.
org_id = "REPLACE_ME"

# Obtain from the MSP portal: Setup → Integrations → MSP Agent → Sites → Token.
enrollment_token = "tok_live_REPLACE_ME"
